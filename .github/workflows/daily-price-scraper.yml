name: Daily price scraper

on:
  schedule:
    # Daily = lightweight aggregator-only fill (AFDC/ChargeAlong). Does NOT burn Bright Data.
    - cron: '27 11 * * *'
    # Secondary afternoon pass to progress AFDC bulk fill.
    - cron: '12 23 * * *'
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'MONTHLY Tesla harvest: Bright Data for empty/missing US stations (chunked). Do not run daily.'
        type: boolean
        required: false
        default: false
      batch_size:
        description: 'Stations to scrape this run when full_sweep is false (1–80; aggregator-only on cron)'
        required: false
        default: '60'
      brightdata_max:
        description: 'With full_sweep: max Bright Data stations this run (default 180; keep under 6h Actions limit)'
        required: false
        default: '180'
      brightdata_empties_only:
        description: 'With full_sweep: only empty/missing rows (skip AFDC approx + skip already-teslaLive). Keep true to save credits.'
        type: boolean
        required: false
        default: true
      refresh_all_tesla:
        description: 'With full_sweep: re-fetch Tesla TOU for ALL open US stations (burns credits; overrides empties_only)'
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full sweep can take hours (ChargeAlong drain across ~3k stations).
    timeout-minutes: ${{ github.event.inputs.full_sweep == 'true' && 360 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app deps
        run: npm ci
      - name: Install scraper deps
        working-directory: scraper
        run: npm ci
      - name: Install curl_cffi (TLS impersonation)
        if: ${{ github.event.inputs.full_sweep != 'true' }}
        run: python -m pip install curl_cffi
      - name: Run scraper
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # full_sweep=false (cron): aggregator-only — brightDataAllowed() stays false.
          # full_sweep=true (manual monthly): Bright Data unlocks live Tesla TOU → Neon.
          SCRAPER_FULL_SWEEP: ${{ github.event.inputs.full_sweep == 'true' && '1' || '0' }}
          SCRAPER_BRIGHTDATA_REFRESH_ALL: ${{ github.event.inputs.refresh_all_tesla == 'true' && '1' || '0' }}
          # Default empties-only when input omitted (cron) or true; only disable when explicitly false.
          SCRAPER_BRIGHTDATA_EMPTIES_ONLY: ${{ github.event.inputs.brightdata_empties_only == 'false' && '0' || '1' }}
          SCRAPER_BRIGHTDATA_MAX: ${{ github.event.inputs.brightdata_max || '180' }}
          SCRAPER_BATCH_SIZE: ${{ github.event.inputs.batch_size || '60' }}
          SCRAPER_BULK_AFDC: '1'
          SCRAPER_DRAIN_MAX: '120'
          SCRAPER_DRAIN_CONCURRENCY: '4'
          SCRAPER_DRAIN_DELAY_MS: '300'
          # Optional — empty secrets are fine (DEMO_KEY / skip Bright Data / skip OCM).
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: npm start
        # Soft-success is handled inside scraper/index.mjs (exit 0) so Tesla blocks never fail the job.
